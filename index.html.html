<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Douaa – Data & Business Analysis Portfolio</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#14203a;--muted:#5b6a86;--accent:#1f5fd1;--line:#dce3f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--text:#e8eefb;--muted:#9fb0d0;--accent:#6ea3ff;--line:#263553;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--text:#e8eefb;--muted:#9fb0d0;--accent:#6ea3ff;--line:#263553;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.links a{display:inline-block;margin:0 8px 8px 0;padding:8px 16px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
.links a:hover{background:var(--accent);color:var(--bg)}
h2{margin:36px 0 14px;font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.card h3{margin:8px 0 6px;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--bg)}
.badge.wip{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tools{margin-top:12px;font-size:.78rem;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.open{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;padding:28px}
.panel h3{margin:0 0 4px;font-size:1.3rem}
.panel h4{margin:18px 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.panel p,.panel li{margin:0;font-size:.95rem}
.panel ul{margin:0;padding-left:20px}
.gh{display:inline-block;margin-top:22px;padding:10px 18px;background:var(--accent);color:var(--bg);border-radius:10px;text-decoration:none;font-weight:700}
.close{float:right;background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer}
footer{margin-top:48px;color:var(--muted);font-size:.85rem}
.about{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.about p{margin:0 0 12px}
[hidden]{display:none!important}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.avatar{position:relative;width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta{margin-top:22px;padding:14px 26px;background:var(--accent);color:var(--bg);border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
.back{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:.95rem;padding:0}
.seek{border-left:4px solid var(--accent);padding:8px 14px;margin:14px 0;background:var(--bg);border-radius:6px}
.chips span{display:inline-block;margin:0 6px 6px 0;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem}
.panel.wide{max-width:920px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media(max-width:720px){.board{grid-template-columns:1fr}}
.col{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.col h5{margin:0 0 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.tk{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:.85rem}
.key{font-size:.78rem;font-weight:700;color:var(--muted)}
.st{background:var(--accent);color:var(--bg);padding:2px 8px;border-radius:4px;font-size:.7rem}
.story{margin:10px 0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:6px;font-style:italic;font-size:.95rem}
.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:5;padding:6px 14px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-weight:700;cursor:pointer}
.lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:12px 0 6px}
</style>
</head>

function P(i){return LANG==="fr"?Object.assign({},PROJECTS[i],FR[i]):PROJECTS[i]}
function renderGrid(){$("grid").innerHTML=PROJECTS.map(function(_,i){var p=P(i),ok=p.tag==="Completed";
 return '<button class="card" data-i="'+i+'"><span class="badge'+(ok?"":" wip")+'">'+(ok?T[LANG].completed:T[LANG].wipb)+'</span><h3>'+esc(p.t)+'</h3><p>'+esc(p.s)+'</p><div class="tools">'+esc(p.tools)+'</div></button>'}).join("")}
function applyLang(){var t=T[LANG];document.documentElement.lang=LANG;document.title=t.title;
 $("sub").textContent=t.sub;$("h-about").textContent=t.about;$("about").innerHTML=t.aboutHtml;$("go").textContent=t.go;$("back").textContent=t.back;
 $("h-proj").textContent=t.projects;$("foot").textContent=t.foot;$("l-cv").textContent=t.cv;$("lang").textContent=t.toggle;renderGrid()}
function col_(t,a){return '<div class="col"><h5>'+t+'</h5>'+a.map(function(x){return '<div class="tk">'+esc(x)+'</div>'}).join("")+'</div>'}
function openTicket_(p){var t=T[LANG],h=Math.ceil(p.steps.length/2),done=p.tag==="Completed";
 $("panel").className="panel wide";
 $("panel").innerHTML='<button class="close" aria-label="Close">×</button><div class="key">'+p.key+' · '+t.story+' · <span class="st">'+(done?t.done:t.wip)+'</span></div><h3>'+esc(p.t)+'</h3><div class="tools">'+esc(p.tools)+'</div><div class="story">'+esc(p.story)+'</div><div class="board">'+col_(t.problem,[p.problem])+col_(t.analysis,p.steps.slice(0,h))+col_(t.solution,p.steps.slice(h))+col_(t.impact,p.results)+'</div>'+(p.repo?'<a class="gh" target="_blank" rel="noopener" href="'+LINKS.github+'/'+p.repo+'">'+t.gh+'</a>':'<p class="tools" style="margin-top:20px">'+t.nogh+'</p>');
 $("modal").classList.add("open")}
$("lang").onclick=function(){LANG=LANG==="fr"?"en":"fr";close_();applyLang()};
applyLang();
function open_(i){var p=P(i);if(p.key)return openTicket_(p);
 $("panel").innerHTML='<button class="close" aria-label="Close">×</button><h3>'+esc(p.t)+'</h3><div class="tools">'+esc(p.tools)+'</div>'+
 '<h4>Problem</h4><p>'+esc(p.problem)+'</p><h4>Approach</h4><ul>'+p.steps.map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+'</ul>'+
 '<h4>Results</h4><ul>'+p.results.map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+'</ul>'+
 '<a class="gh" target="_blank" rel="noopener" href="'+LINKS.github+'/'+p.repo+'">View on GitHub →</a>';
 $("modal").classList.add("open")}
function close_(){$("modal").classList.remove("open")}
$("grid").addEventListener("click",function(e){var c=e.target.closest(".card");if(c)open_(+c.dataset.i)});
$("modal").addEventListener("click",function(e){if(e.target===$("modal")||e.target.classList.contains("close"))close_()});
function show(){var p=location.hash==="#projects";$("home").hidden=p;$("projects").hidden=!p;close_();window.scrollTo(0,0)}
$("go").onclick=function(){location.hash="projects"};
$("back").onclick=function(){location.hash="home"};
window.addEventListener("hashchange",show);show();
document.addEventListener("keydown",function(e){if(e.key==="Escape")close_()});
</script>
</body>
</html>
